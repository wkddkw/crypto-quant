name: tests

# The paper ledgers on the live node run unattended every hour. This workflow is the
# only automated check that ledger, costing, and reporting logic still behave before
# a merge reaches that node.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 mirrors the owner's local Mac; 3.11 mirrors the live node.
        # Testing both catches version drift before it reaches the hourly cycle.
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm no research data is present
        # data/ is gitignored and must never be required by the suite. If this ever
        # fails, a test has grown a dependency on local paper data.
        run: |
          if [ -d data ]; then
            echo "::error::data/ exists in a clean checkout; tests may depend on it"
            exit 1
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check scripts are syntactically valid
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" && echo "ok: $script"
          done
